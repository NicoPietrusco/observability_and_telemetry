name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR supersedes the previous run; runs on master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install locked development tools
        run: uv sync --group dev --locked
      - name: Run hooks (lint, format, lock file, workflow audit)
        env:
          # Enables zizmor's online audits, such as known-vulnerable actions and impostor commits.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen prek run --all-files --show-diff-on-failure

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose files
        run: |
          docker compose -f infra/docker-compose.obs.yml config -q
          docker compose -f infra/docker-compose.api.yml config -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: telemetry-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API
        run: |
          docker run -d --name api -p 8000:8000 telemetry-demo:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/metrics > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/end1/25 | grep -q '"root":5.0'
          curl -sf "http://localhost:8000/end2/?text=HelloWorld" > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/end1/-5)" = "400"
          curl -sf http://localhost:8000/metrics | grep -q http_requests_total

      - name: Show API logs
        if: always()
        run: docker logs api || true
