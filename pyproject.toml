[project]
name = "observability-and-telemetry"
version = "0.1.0"
description = "Demo of the three pillars of observability (metrics, logs, traces) with FastAPI, OpenTelemetry and the Grafana LGTM stack on S3-compatible storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.4",
    "loguru>=0.7.3",
    "uvicorn>=0.38.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.9",
    "zizmor>=1.32.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "Q", "UP", "C4", "SIM"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project isn't installed, so put the repo root on sys.path to import `app`.
pythonpath = ["."]
# importlib mode lets tests/<pkg>/ mirror app/ without __init__.py or basename clashes
addopts = ["--import-mode=importlib"]
python_files = ["*_test.py"]

# Coverage runs in CI and with `just coverage`, not on every `just test`, so running a
# single test file never trips the threshold.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
